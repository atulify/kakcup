<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAK Cup — Styling concepts</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e9e7; color: #242424; font: 15px/1.5 system-ui, sans-serif; }
  .intro { max-width: 1500px; margin: auto; padding: 42px 28px 24px; }
  .intro h1 { margin: 0 0 8px; font-size: clamp(26px, 3vw, 36px); letter-spacing: -.04em; }
  .intro p { max-width: 720px; margin: 0; color: #61615f; }
  .concepts { max-width: 1500px; margin: auto; padding: 0 28px 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 28px; align-items: start; }
  .concept { min-width: 0; }
  .concept-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
  .concept-label h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
  .concept-label span { font-size: 12px; color: #747471; white-space: nowrap; }
  .mock { --bg:#111; --surface:#1b1b1b; --orange:#ff6a1a; --text:#f4f4f2; --muted:#aaa; --line:#343434; --radius:7px; background: var(--bg); color: var(--text); border-radius: 12px; overflow: hidden; box-shadow: 0 12px 32px #0002; min-height: 492px; }
  .bar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; letter-spacing: -.035em; font-size: 17px; }
  .brand i { color: var(--orange); font-style: normal; }
  .account { font-size: 12px; color: var(--muted); }
  .content { padding: 24px 22px 20px; }
  .overline { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 3px 0 17px; }
  .title-row h3 { font-size: 26px; line-height: 1.15; letter-spacing: -.035em; margin: 0; }
  .button { display: inline-flex; justify-content: center; align-items: center; background: var(--orange); color: #17100b; border-radius: var(--radius); font-size: 12px; font-weight: 750; padding: 9px 12px; white-space: nowrap; }
  .nav { display: flex; gap: 19px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow: hidden; }
  .nav span { display: block; padding: 0 0 10px; white-space: nowrap; color: var(--muted); font-size: 12px; }
  .nav .active { color: var(--orange); border-bottom: 2px solid var(--orange); font-weight: 700; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .panel-header { padding: 15px 15px 11px; display: flex; justify-content: space-between; align-items: center; }
  .panel-header strong { font-size: 14px; }
  .panel-header span { color: var(--muted); font-size: 11px; }
  .table-head, .row { display: grid; grid-template-columns: 30px 1fr 54px 46px; gap: 7px; align-items: center; padding: 10px 15px; }
  .table-head { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding-top: 6px; padding-bottom: 8px; }
  .row { border-top: 1px solid var(--line); font-size: 12px; }
  .row .rank { color: var(--muted); }
  .row.first .rank, .row.first .points { color: var(--orange); font-weight: 800; }
  .team { font-weight: 650; }
  .detail { display: block; font-size: 10px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .foot { padding: 15px 2px 0; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .foot strong { color: var(--text); font-weight: 600; }
  .club { --bg:#181614; --surface:#24211e; --orange:#e77a36; --text:#f2ede7; --muted:#b4aaa0; --line:#3a3430; --radius:11px; }
  .club .brand, .club .title-row h3 { font-family: Georgia, serif; font-weight: 600; letter-spacing: -.025em; }
  .club .bar { border-bottom: 0; }
  .club .content { padding-top: 19px; }
  .club .overline { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .club .panel { border-color: #39322b; }
  .club .panel-header { padding: 19px 17px 13px; }
  .data { --bg:#15171a; --surface:#15171a; --orange:#ff711f; --text:#eceef0; --muted:#a1a7ac; --line:#34383d; --radius:4px; }
  .data .brand { letter-spacing: 0; font-size: 14px; }
  .data .content { padding-top: 29px; }
  .data .panel { border: 0; }
  .data .panel-header { padding-left: 0; padding-right: 0; }
  .data .table-head, .data .row { padding-left: 0; padding-right: 0; }
  .data .table-head { border-bottom: 1px solid var(--line); }
  .data .row { border-top: 0; border-bottom: 1px solid var(--line); padding-top: 13px; padding-bottom: 13px; }
  .tournament { --bg:#101113; --surface:#1c1e21; --orange:#ff5a00; --text:#f5f5f5; --muted:#a8aaad; --line:#35373b; --radius:5px; }
  .tournament .bar { border-top: 4px solid var(--orange); height: 60px; }
  .tournament .brand { text-transform: uppercase; letter-spacing: .04em; }
  .tournament .title-row h3 { text-transform: uppercase; font-stretch: condensed; font-weight: 900; letter-spacing: -.045em; }
  .tournament .panel-header { border-left: 3px solid var(--orange); }
  .tournament .row.first { background: #ff5a0010; }
  .outdoors { --bg:#151b19; --surface:#202925; --orange:#f27632; --text:#edf2ed; --muted:#acbbb0; --line:#37483c; --radius:12px; }
  .outdoors .bar { border-bottom-color: #2c3931; }
  .outdoors .brand i { color: #9bc0a1; }
  .outdoors .nav .active { border-bottom-color: var(--orange); }
  .outdoors .title-row h3 { letter-spacing: -.04em; }
  .outdoors .panel { border-color:#344239; }
  .outdoors .panel-header { padding: 18px 17px 12px; }
  .outdoors .row { padding-top: 12px; padding-bottom: 12px; }
  @media (max-width: 500px) { .intro { padding: 28px 16px 20px; } .concepts { padding: 0 16px 36px; gap: 24px; } .mock { min-height: 0; } .content { padding: 20px 16px; } .bar { padding: 0 16px; } .nav { gap: 13px; } }
</style>
</head>
<body>
<header class="intro"><h1>Five directions for KAK Cup</h1><p>Concept mockups using the same sample standings. These are visual examples, not connected to live data; the real app remains unchanged.</p></header>
<main class="concepts" id="concepts"></main>
<script>
const concepts = [
  { cls: 'scoreboard', title: '1. Clean Scoreboard', note: 'Simple & sporty', subtitle: 'Competition overview', heading: '2026 tournament', action: 'Enter scores' },
  { cls: 'club', title: '2. Warm Clubhouse', note: 'Warm & traditional', subtitle: 'Arnprior · Est. 1999', heading: 'The 2026 Cup', action: 'Enter scores' },
  { cls: 'data', title: '3. Minimal Data Table', note: 'Information first', subtitle: '2026 season', heading: 'Standings', action: 'Enter scores' },
  { cls: 'tournament', title: '4. Modern Tournament', note: 'Bold & focused', subtitle: 'KAK Cup · 2026', heading: 'Leaderboard', action: 'Enter scores' },
  { cls: 'outdoors', title: '5. Quiet Outdoors', note: 'Relaxed & natural', subtitle: 'A weekend worth keeping', heading: 'The 2026 Cup', action: 'Enter scores' }
];
const rows = [
  ['1', 'The River Rats', 'Pope · Dyer · Bopper · Newt', '18.5', '7'],
  ['2', 'The Old Hooks', 'Nych · Norton · Tank · Body', '16', '6'],
  ['3', 'Bogey Bandits', 'Burns · Hooper · Fatty · Sub', '13.5', '5']
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('concepts').innerHTML = concepts.map(c => `
  <section class="concept" aria-label="${esc(c.title)}">
    <div class="concept-label"><h2>${esc(c.title)}</h2><span>${esc(c.note)}</span></div>
    <div class="mock ${esc(c.cls)}">
      <div class="bar"><div class="brand"><i>KAK</i> CUP</div><div class="account">Home &nbsp; · &nbsp; Admin</div></div>
      <div class="content">
        <div class="overline">${esc(c.subtitle)}</div>
        <div class="title-row"><h3>${esc(c.heading)}</h3><span class="button">${esc(c.action)}</span></div>
        <div class="nav"><span>Teams</span><span>Fish</span><span>Chug</span><span>Golf</span><span class="active">Standings</span></div>
        <div class="panel"><div class="panel-header"><strong>Overall standings</strong><span>3 teams</span></div>
          <div class="table-head"><span>#</span><span>Team</span><span class="num">Total</span><span class="num">Golf</span></div>
          ${rows.map((r,i)=>`<div class="row ${i===0?'first':''}"><span class="rank">${esc(r[0])}</span><span class="team">${esc(r[1])}<span class="detail">${esc(r[2])}</span></span><span class="num points">${esc(r[3])}</span><span class="num">${esc(r[4])}</span></div>`).join('')}
        </div>
        <div class="foot"><span><strong>Fish</strong> · Chug · Golf</span><span>Results update as scores are entered</span></div>
      </div>
    </div>
  </section>`).join('');
</script>
</body>
</html>

[package]
name = "kakcup-backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "rust-backend/src/lib.rs"

[[bin]]
name = "local-api"
path = "rust-backend/src/main.rs"

[[bin]]
name = "rust-api"
path = "api/rust-api.rs"

[[test]]
name = "api_rust"
path = "rust-backend/tests/api_rust.rs"

[dependencies]
axum = "0.8"
bcrypt = "0.17"
jsonwebtoken = { version = "9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "bigdecimal"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
